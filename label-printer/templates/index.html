<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Étiquettes — Brother QL-570</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>🏷️ Impression d'étiquettes</h1>
    <span class="sub">Brother QL-570</span>
  </header>

  <main>
    <form id="label-form" class="panel">
      <label class="field">
        <span>Format du rouleau DK</span>
        <select name="label" id="label">
          {% for l in labels %}
          <option value="{{ l.id }}" {% if l.id == cfg.label %}selected{% endif %}>{{ l.name }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="row" style="margin:-.5rem 0 1rem">
        <button type="button" id="detect-media-btn" class="ghost">🔎 Détecter l'étiquette dans la machine</button>
      </div>
      <small id="media-result"></small>

      <label class="field" id="length-field">
        <span>Longueur (mm, rouleau continu — 0 = auto)</span>
        <input type="number" name="length_mm" value="{{ cfg.length_mm }}" min="0" max="1000">
      </label>

      <fieldset>
        <legend>Texte</legend>
        <textarea name="text" rows="3" placeholder="Une ligne par retour à la ligne…"></textarea>
        <div class="row">
          <label class="field small">
            <span>Taille (0 = auto)</span>
            <input type="number" name="font_size" value="{{ cfg.font_size }}" min="0" max="200">
          </label>
          <label class="field small">
            <span>Alignement</span>
            <select name="align">
              <option value="center" {% if cfg.align == 'center' %}selected{% endif %}>Centré</option>
              <option value="left" {% if cfg.align == 'left' %}selected{% endif %}>Gauche</option>
              <option value="right" {% if cfg.align == 'right' %}selected{% endif %}>Droite</option>
            </select>
          </label>
          <label class="field small checkbox">
            <input type="checkbox" name="bold" {% if cfg.bold %}checked{% endif %}> <span>Gras</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>QR code</legend>
        <input type="text" name="qr_data" placeholder="URL ou texte du QR code">
        <label class="field small" style="margin-top:.6rem">
          <span>Taille du QR (mm — 0 = auto)</span>
          <input type="number" name="qr_size_mm" value="{{ cfg.qr_size_mm }}" min="0" max="62">
        </label>
      </fieldset>

      <fieldset>
        <legend>Code-barres</legend>
        <div class="row">
          <input type="text" name="barcode_data" placeholder="Données du code-barres">
          <select name="barcode_type">
            {% set bt = cfg.barcode_type %}
            <option value="code128" {% if bt == 'code128' %}selected{% endif %}>Code128</option>
            <option value="code39" {% if bt == 'code39' %}selected{% endif %}>Code39</option>
            <option value="ean13" {% if bt == 'ean13' %}selected{% endif %}>EAN-13</option>
            <option value="ean8" {% if bt == 'ean8' %}selected{% endif %}>EAN-8</option>
            <option value="upca" {% if bt == 'upca' %}selected{% endif %}>UPC-A</option>
            <option value="isbn13" {% if bt == 'isbn13' %}selected{% endif %}>ISBN-13</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Image / logo</legend>
        <input type="file" name="image" accept="image/*">
      </fieldset>

      <fieldset>
        <legend>Imprimante</legend>
        <input type="text" name="printer" value="{{ cfg.printer }}">
        <div class="row">
          <label class="field small checkbox">
            <input type="checkbox" name="cut" {% if cfg.cut %}checked{% endif %}> <span>Couper après impression</span>
          </label>
          <button type="button" id="detect-btn" class="ghost">Détecter</button>
        </div>
        <small id="detect-result"></small>
      </fieldset>

      <div class="actions">
        <button type="button" id="preview-btn" class="ghost">Aperçu</button>
        <button type="button" id="save-btn" class="ghost">💾 Enregistrer comme défaut</button>
        <button type="submit" id="print-btn">Imprimer</button>
      </div>
      <div id="status" class="status"></div>
    </form>

    <section class="panel preview-panel">
      <h2>Aperçu</h2>
      <div class="preview-box">
        <img id="preview-img" alt="Aperçu de l'étiquette">
        <p id="preview-empty">Cliquez sur « Aperçu » pour visualiser l'étiquette.</p>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
